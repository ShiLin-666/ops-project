---
- name: K8s 节点标准化初始化
  hosts: k8s
  become: yes
  tasks:
    - name: 设置主机名
      hostname:
        name: "{{ inventory_hostname }}"

    - name: 添加集群 hosts 映射
      lineinfile:
        path: /etc/hosts
        line: "{{ item }}"
      loop:
        - "172.21.244.83 k8s-master"
        - "172.21.244.84 k8s-node1"
        - "172.21.244.85 k8s-node2"

    - name: 立即关闭 swap
      command: swapoff -a
      ignore_errors: yes

    - name: 注释 fstab 里的 swap 行
      replace:
        path: /etc/fstab
        regexp: '^(.*swap.*)$'
        replace: '#\1'

    - name: 写内核模块自动加载清单
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: 立即加载内核模块
      command: modprobe {{ item }}
      loop: [overlay, br_netfilter]

    - name: 写内核参数配置
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1

    - name: 应用内核参数
      command: sysctl --system
